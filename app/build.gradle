plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.shahab.game'
    compileSdk 34

    defaultConfig {
        applicationId "ir.shahab.game"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'SevenKhans2026'
            keyAlias 'sevenkhans'
            keyPassword 'SevenKhans2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
