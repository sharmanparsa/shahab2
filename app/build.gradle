plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.shahab.game'
    compileSdk 34

    defaultConfig {
        applicationId "ir.shahab.game"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"

        // ===== پرداخت مایکت =====
        // کلید عمومی (RSA) برنامه را از پنل توسعه‌دهندگان مایکت کپی کن و به‌جای متن زیر بگذار
        def MYKET_KEY = "PUT_YOUR_MYKET_PUBLIC_KEY_HERE"
        def marketApplicationId = "ir.mservices.market"
        def marketBindAddress = "ir.mservices.market.InAppBillingService.BIND"
        manifestPlaceholders = [marketApplicationId: marketApplicationId,
                                marketBindAddress  : marketBindAddress,
                                marketPermission   : marketApplicationId + ".BILLING"]
        buildConfigField "String", "IAB_PUBLIC_KEY", "\"" + MYKET_KEY + "\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'SevenKhans2026'
            keyAlias 'sevenkhans'
            keyPassword 'SevenKhans2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.myketstore:myket-billing-client:1.19'
}
