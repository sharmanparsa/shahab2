<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0;height:100%;background:#15110D}.rot{display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap">
<style>
/* Layout: the stage fills the whole viewport; HUD, touch pad and every menu float over the canvas. */
:root{
  --bg:#15110D; --surface:#221B14; --ink:#F1E8DA; --muted:#B3A28C; --line:#3B3023;
  --turq:#3CC5BE; --on-turq:#052624; --gold:#F0B93A; --rose:#EE7487; --veil:rgba(21,17,13,.95);
  --hud-bg:rgba(0,0,0,.4); --hud-ink:#fff;
  --pad-bg:rgba(255,255,255,.5); --pad-ink:#1c1c1c; --pad-line:rgba(0,0,0,.35);
  --f-display:"Lalezar","Vazirmatn",Tahoma,sans-serif;
  --f-body:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDE6DA; --surface:#FBF8F2; --ink:#2A2118; --muted:#6B5E4E; --line:#D6C9B5;
    --turq:#0E8C8A; --on-turq:#FFFFFF; --gold:#B87A00; --rose:#B5384A; --veil:rgba(251,248,242,.96); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDE6DA; --surface:#FBF8F2; --ink:#2A2118; --muted:#6B5E4E; --line:#D6C9B5;
  --turq:#0E8C8A; --on-turq:#FFFFFF; --gold:#B87A00; --rose:#B5384A; --veil:rgba(251,248,242,.96); color-scheme:light;
}
*{-webkit-tap-highlight-color:transparent}
.stage,.stage *{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
textarea{-webkit-user-select:text; user-select:text}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55; min-height:100%; overflow:hidden}
.page{box-sizing:border-box; padding-left:max(0px,env(safe-area-inset-left,0px)); padding-right:max(0px,env(safe-area-inset-right,0px)); padding-block:0}
h1,h2,h3{font-family:var(--f-display); font-weight:400; margin:0; text-wrap:balance; line-height:1.2}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--turq); outline-offset:2px}

.stage{position:relative; margin:0 auto; overflow:hidden; background:#000; touch-action:none; width:480px; height:320px}
canvas#cv{display:block; width:100%; height:100%; }

.hud{position:absolute; top:0; left:0; right:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:6px; padding:4px 8px; box-sizing:border-box; background:var(--hud-bg); color:var(--hud-ink); pointer-events:none}
.wname{font-family:var(--f-display); font-size:clamp(12px,3.4vh,18px); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stats{display:flex; gap:4px; font-size:clamp(10px,2.8vh,14px); white-space:nowrap; align-items:center}
.st{display:inline-flex; align-items:center; gap:2px; padding:0 6px; border-radius:11px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); font-weight:700}
.st b{font-variant-numeric:tabular-nums; margin-inline-start:2px}
.st.sc{background:rgba(255,200,60,.2); border-color:#FFD25A} .st.sc b{color:#FFE28E}
.st.co{background:rgba(255,160,30,.22); border-color:#F2A81E} .st.co b{color:#FFC95E}
.st.sinc{background:rgba(70,200,110,.22); border-color:#52D07A} .st.sinc b{color:#A8F0B4}
.st.am{background:rgba(80,160,255,.24); border-color:#6EB0FF} .st.am b{color:#B4D8FF}
.st.tm{background:rgba(190,120,255,.24); border-color:#C08AFF} .st.tm b{color:#E2C8FF}
.st.liv{background:linear-gradient(180deg,#EC3A52,#A81C30); border-color:#FFA8B4; color:#fff; padding:0 8px; box-shadow:0 0 8px rgba(255,60,90,.6)}
.st.liv b{font-size:1.32em; color:#fff; line-height:1}
.st.liv::before{content:"\2764"; color:#FFD6DC; font-size:1.05em}
.st.liv.low{background:linear-gradient(180deg,#FF2020,#B00000); border-color:#fff; animation:lowL .7s ease-in-out infinite}
@keyframes lowL{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.st.liv.low{animation:none}}
.cd3{position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center; pointer-events:none; font-family:var(--f-display); font-size:clamp(70px,34vh,180px); color:#fff; text-shadow:0 0 24px rgba(255,200,60,.9),0 4px 0 #7A3A12,0 0 6px #000; -webkit-text-stroke:2px #7A3A12}
.cd3[hidden]{display:none}
.cd3.pop{animation:cdpop .9s ease-out}
@keyframes cdpop{0%{transform:scale(2.2); opacity:0}25%{opacity:1}100%{transform:scale(.9); opacity:.35}}
.btns{display:flex; gap:5px; pointer-events:auto}
.mini{background:rgba(255,255,255,.18); color:var(--hud-ink); border:1px solid rgba(255,255,255,.4); border-radius:8px; padding:0 9px; min-height:24px; font-weight:700; font-size:clamp(10px,2.6vh,13px)}

.ov{position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box; background:var(--veil); overflow:auto}
.ov[hidden]{display:none}
.box{text-align:center; max-width:360px; margin:auto; display:flex; flex-direction:column; gap:6px; align-items:center}
.box.wide{max-width:none; width:100%; flex-direction:row; justify-content:center; gap:clamp(12px,4vw,36px)}
.box.wide>div{display:flex; flex-direction:column; gap:6px; align-items:center; min-width:0; flex:1 1 0; max-width:340px}
.box h1{font-size:clamp(34px,12vh,72px); color:var(--turq)}
.box h2{font-size:clamp(20px,6.5vh,36px); color:var(--turq)}
.box h3{font-size:clamp(15px,4vh,22px)}
.box .sub{font-family:var(--f-display); font-size:clamp(15px,4.2vh,25px)}
.box p{margin:0; font-size:clamp(11px,2.7vh,15px)}
.muted{color:var(--muted)}
.menu{display:flex; flex-direction:column; gap:7px; align-items:stretch; width:100%}
.btn{background:var(--turq); color:var(--on-turq); border:0; border-radius:12px; padding:7px 24px; font-weight:700; min-height:40px; font-size:clamp(12px,3vh,16px)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line)}
.btn.sm{padding:3px 14px; min-height:32px; font-size:clamp(11px,2.6vh,14px)}
.btn[disabled]{opacity:.45; cursor:default}
.row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center}
.cards{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%}
.hc.lk canvas{filter:brightness(.82)}
.chr canvas{width:auto; height:72px; flex:none}
.chr .chd{flex:1; text-align:start; font-size:13px; line-height:1.4}
.chr{align-items:center; gap:8px}
.hc{flex:1 1 140px; max-width:160px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 6px; border-radius:14px; border:2px solid var(--line); background:var(--surface); color:var(--ink)}
.hc.sel{border-color:var(--turq)}
.hc canvas{width:auto; height:clamp(70px,22vh,150px)}
.hc b{font-family:var(--f-display); font-weight:400; font-size:clamp(15px,4vh,22px)}
.hc span{font-size:clamp(10px,2.4vh,13px); color:var(--muted); text-align:center}
.tally{display:grid; grid-template-columns:1fr auto; gap:0 16px; width:100%; font-size:clamp(12px,3vh,16px)}
.tally b{font-variant-numeric:tabular-nums}
.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; width:100%}
.list li{display:flex; justify-content:space-between; gap:10px; padding:4px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface); font-size:clamp(11px,2.7vh,14px)}
.verse{border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:6px 10px; font-size:clamp(11px,2.7vh,14px); text-align:start; width:100%; box-sizing:border-box}
.verse small{display:block; color:var(--muted)}
.verse .miss{color:var(--muted)}
.sins{display:flex; gap:4px; flex-wrap:wrap}
.sins i{width:14px; height:14px; border-radius:50%; background:var(--line); display:inline-block}
.sins i.on{background:#6BCB77}
.gal{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; width:100%; max-height:62vh; overflow:auto}
.banner{position:absolute; z-index:2; top:16%; left:0; right:0; text-align:center; pointer-events:none; font-family:var(--f-display); font-size:clamp(18px,6vh,32px); color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.75); opacity:0; padding:0 10px}
.banner.show{animation:bn 2.6s ease both}
.banner.long.show{animation:bn 6s ease both; font-size:clamp(20px,7vh,36px)}
.szr{display:flex;align-items:center;gap:8px;width:100%}.szr input{flex:1;accent-color:#E0B04A}.szp{display:flex;gap:10px;justify-content:center;align-items:flex-end;direction:ltr;min-height:100px;pointer-events:none}.szp .pb{pointer-events:none}
@keyframes bn{0%{opacity:0;transform:translateY(-8px)} 12%,78%{opacity:1;transform:none} 100%{opacity:0}}

.pad{position:absolute; z-index:2; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:flex-end; padding:8px 14px; box-sizing:border-box; pointer-events:none; direction:ltr; user-select:none; -webkit-user-select:none}
.pad .grp{display:flex; gap:10px}
.pb{pointer-events:auto; width:calc(clamp(54px,16vh,86px)*var(--ps,1)); height:calc(clamp(50px,15vh,76px)*var(--ps,1)); border-radius:16px; background:var(--pad-bg); color:var(--pad-ink); border:2px solid var(--pad-line); display:grid; place-items:center; font-weight:700; font-size:clamp(14px,4vh,24px); touch-action:none; -webkit-tap-highlight-color:transparent}
.pb.act{height:calc(clamp(66px,20vh,104px)*var(--ps,1)); width:calc(clamp(76px,23vh,118px)*var(--ps,1)); font-size:clamp(10px,2.7vh,15px)}
.pb.jump{height:calc(clamp(72px,22vh,112px)*var(--ps,1)); width:calc(clamp(88px,26vh,140px)*var(--ps,1)); font-size:clamp(13px,3.2vh,19px)}
.pb.off{opacity:.35}
.pb.on{background:var(--turq); color:var(--on-turq)}
.stg{display:flex; justify-content:space-between; align-items:center}
.stg.khanb{background:var(--gold); color:#1c1c1c}
.dlg{position:absolute; inset:0; z-index:4; display:flex; align-items:flex-end; padding:8px; box-sizing:border-box; background:linear-gradient(transparent 35%,rgba(0,0,0,.45)); cursor:pointer}
.dpan{display:flex; gap:8px; align-items:flex-end; width:100%}
.dp{width:clamp(48px,15vh,84px); flex:none; border-radius:12px; background:rgba(0,0,0,.5); border:2px solid rgba(255,255,255,.25); opacity:.5; transition:opacity .2s}
.dp.act{opacity:1; border-color:var(--gold)}
.dp canvas{display:block; width:100%; height:auto}
.db{flex:1; min-width:0; background:var(--surface); color:var(--ink); border:2px solid var(--gold); border-radius:14px; padding:6px 12px; min-height:clamp(60px,20vh,100px); font-size:clamp(12px,3.2vh,17px); text-align:start}
.dn{display:flex; gap:6px; align-items:center; color:var(--gold); font-family:var(--f-display)}
.env{font-size:1.1em}
.db small{display:block; color:var(--muted); font-size:10px; text-align:end}
.dlg .sk{position:absolute; top:34px; inset-inline-end:8px}
.stick{display:none; pointer-events:auto; touch-action:none; width:calc(clamp(96px,30vh,150px)*var(--ps,1)); height:calc(clamp(96px,30vh,150px)*var(--ps,1)); border-radius:50%; background:var(--pad-bg); border:2px solid var(--pad-line); position:relative}
.knob{position:absolute; left:50%; top:50%; width:46%; height:46%; margin:-23% 0 0 -23%; border-radius:50%; background:var(--turq); border:2px solid var(--pad-line)}
.pad.stk .stick{display:block}
.pad.stk .grp.mv .pb{display:none}
.ctlrow{display:flex;gap:10px;width:100%}.ctlc{flex:1;background:#2A2118;border:2px solid #5A4630;border-radius:12px;padding:6px;color:var(--text,#f3e4be);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px}.ctlc.on{border-color:var(--gold,#E0B04A)}.ctlc svg{width:100%;height:auto;display:block}.cb{display:flex;align-items:center;gap:8px;justify-content:center;font-weight:700}.ck{width:20px;height:20px;border:2px solid #E0B04A;border-radius:4px;display:inline-block;position:relative}.ck.on{background:#E0B04A}.ck.on:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #2A2118;border-width:0 3px 3px 0;transform:rotate(45deg)}.pot{display:flex;align-items:center;gap:8px;text-align:start}.pot canvas{width:34px;height:45px}.shopr{display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%}
.pad[hidden],.edbar[hidden]{display:none}

.mapbox{display:flex; gap:12px; align-items:center; justify-content:center; width:100%}
.mapwrap{position:relative; flex:none; width:min(58vw,calc((100vh - 120px)*1.127)); aspect-ratio:400/355; margin:0}
.mapwrap svg{position:absolute; inset:0; width:100%; height:100%}
.lg{display:flex; flex-direction:column; gap:5px; flex:1 1 150px; max-width:230px}
@media (max-width:560px){.mapbox{flex-direction:column}.mapwrap{width:min(92vw,calc((100vh - 200px)*1.127))}.lg{display:none}}
.node{position:absolute; transform:translate(-50%,-50%); min-width:clamp(22px,6vh,34px); height:clamp(22px,6vh,34px); border-radius:50%; border:2px solid var(--ink); background:var(--surface); color:var(--ink); font-weight:700; font-size:clamp(10px,2.6vh,14px); display:grid; place-items:center; padding:0}
.node.cur{background:var(--gold); color:#1c1c1c; border-color:var(--gold)}
.node.done{background:var(--turq); color:var(--on-turq); border-color:var(--turq)}
.node[disabled]{opacity:.45; cursor:default}
.nlabel{position:absolute; pointer-events:none; display:flex; flex-direction:column; line-height:1.15; padding:1px 6px; border-radius:7px; background:rgba(251,248,242,.86); color:#2A2118; border:1px solid rgba(90,60,30,.4); white-space:nowrap}
.nlabel b{font-family:var(--f-display); font-weight:400; font-size:clamp(10px,2.7vh,15px)}
.nlabel small{font-size:clamp(8px,2vh,11px); color:#6B3A1E}
.nlabel.r{transform:translate(18px,-50%)}
.nlabel.l{transform:translate(calc(-100% - 18px),-50%)}
.nlabel.b{transform:translate(-50%,16px)}
.nlabel.bl{transform:translate(-88%,16px)}
.nlabel.t{transform:translate(-50%,calc(-100% - 16px))}

.edbar{position:absolute; z-index:2; left:0; right:0; bottom:0; padding:6px 8px; box-sizing:border-box; background:var(--hud-bg); display:flex; flex-wrap:wrap; gap:5px; justify-content:center; direction:ltr}
.edbar .mini{min-height:28px}
.edbar .mini.on{background:var(--turq); color:var(--on-turq); border-color:var(--turq)}
textarea{width:100%; box-sizing:border-box; height:70px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; font-size:11px; direction:ltr}
.rot{display:none; margin:8px 16px 0; text-align:center; font-size:14px; color:var(--gold); font-weight:700}
@media (orientation:portrait){.rot{display:block}}

.gd{position:absolute;inset:0;z-index:6;cursor:pointer;direction:rtl}
.gd-full{position:absolute;inset:0}
.gd-hl{position:absolute;border:3px solid #FFD25A;border-radius:10px;box-shadow:0 0 0 400vmax rgba(0,0,0,.72),0 0 18px 4px rgba(255,210,90,.75);animation:gdp 1.1s ease-in-out infinite;pointer-events:none;box-sizing:border-box}
@keyframes gdp{50%{box-shadow:0 0 0 400vmax rgba(0,0,0,.72),0 0 28px 8px rgba(255,210,90,.95)}}
.gd-ar{position:absolute;color:#FFD25A;font-size:24px;line-height:24px;width:20px;text-align:center;animation:gdb .7s ease-in-out infinite;pointer-events:none;text-shadow:0 2px 4px #000}
@keyframes gdb{50%{transform:translateY(6px)}}
.gd-r{position:absolute;bottom:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6));pointer-events:none}
.gd-b{position:absolute;background:var(--surface);color:var(--ink);border:3px solid #E0B04A;border-radius:16px;padding:8px 14px;box-sizing:border-box;font-size:clamp(13px,3.6vh,19px);line-height:1.7;text-align:start;box-shadow:0 6px 22px rgba(0,0,0,.5);min-height:70px}
.gd-h{display:flex;gap:6px;align-items:center;color:#B8861F;font-family:var(--f-display);font-size:1.15em}
.gd-t{min-height:3.4em}
.gd-b small{display:block;color:var(--muted);font-size:11px;text-align:end}
.gd-sk{position:absolute;top:34px;inset-inline-end:8px}
.gd-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92%);background:var(--surface);color:var(--ink);border:3px solid #E0B04A;border-radius:16px;padding:10px 16px;box-sizing:border-box;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.6);max-height:94%;overflow:auto}
.gd-card h3{color:#B8861F;margin:2px 0}.gd-card p{margin:3px 0;font-size:clamp(12px,3.2vh,16px)}.gd-card canvas{display:block;margin:0 auto}.gd-card small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.gd-c .gd-hl{box-shadow:0 0 0 400vmax rgba(0,0,0,.6),0 0 18px 4px rgba(255,210,90,.75)}
.gdtog{display:flex;gap:8px;align-items:center;cursor:pointer}
@media (prefers-reduced-motion:reduce){.banner.show{animation:none; opacity:1}}
</style>

<div class="page" id="page" dir="rtl" lang="fa">
  <div class="stage" id="stage">
    <canvas id="cv" width="480" height="320" aria-label="game"></canvas>
    <div class="hud" id="hud">
      <span class="wname" id="lname">هفت‌خان</span>
      <span class="stats">
        <span class="st sc"><span data-t="score">امتیاز</span> <b id="hs">۰</b></span>
        <span class="st co"><span data-t="coins">سکه</span> <b id="hc">۰</b></span>
        <span class="st sinc"><span data-t="sin">سین</span> <b id="hn">۰/۷</b></span>
        <span class="st liv" id="hlw"><span data-t="lives">جان</span> <b id="hl">۳</b></span>
        <span class="st am"><span data-t="ammo">فشنگ</span> <b id="ha">۱۰</b></span>
        <span class="st tm"><span data-t="time">زمان</span> <b id="ht">۰</b></span>
      </span>
      <span class="btns"><button class="mini" id="lang" type="button">EN</button><button class="mini" id="snd" type="button">♪</button><button class="mini" id="pause" type="button" data-t="pause">مکث</button></span>
    </div>
    <div class="banner" id="banner"></div>
    <div class="cd3" id="cd3" hidden></div>
    <div class="pad" id="pad">
      <div class="grp mv">
        <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
        <button class="pb" type="button" data-k="left" aria-label="left">◀</button>
        <button class="pb" type="button" data-k="right" aria-label="right">▶</button>
      </div>
      <div class="grp">
        <button class="pb act" type="button" data-k="shoot" data-t="shootB">شلیک</button>
        <button class="pb jump" type="button" data-k="jump" data-t="jump">بپر</button>
      </div>
    </div>
    <div class="edbar" id="edbar" hidden></div>
    <div class="ov" id="ov"></div>
  </div>
  <p class="rot" data-t="rot">برای بازی تمام‌صفحه، گوشی رو افقی بگیر.</p>
</div>

<script>
(function(){"use strict";
var $=function(id){return document.getElementById(id)};
var TS=32, VW=480, VH=320, ROWS=10, GR=8, RS=5;
var cv=$("cv"), cx=cv.getContext("2d"), RSC=1;
cx.imageSmoothingEnabled=true;
function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function fit(){
  var W=window.innerWidth||document.documentElement.clientWidth||480, H=window.innerHeight||document.documentElement.clientHeight||320;
  var asp=Math.max(0.5,W/Math.max(H,1)), nv=Math.max(432,Math.min(720,Math.round(VH*asp/8)*8));
  var sw=Math.min(W,H*VW/VH), sh=sw*VH/VW, st=$("stage");
  var rs=Math.max(1,Math.min(3,Math.round(sw*(window.devicePixelRatio||1)/nv)));
  if(nv!==VW||rs!==RSC){VW=nv; RSC=rs; cv.width=VW*RSC; cv.height=VH*RSC; cx.imageSmoothingEnabled=true; if(window.__onResize) window.__onResize()}
  sw=Math.min(W,H*VW/VH); sh=sw*VH/VW;
  st.style.width=Math.floor(sw)+"px"; st.style.height=Math.floor(sh)+"px";
}

/* ---------- زبان ---------- */

      ["دشتِ پهناور و سراب‌گون؛ گور در هر خیزی به شکلی دیگر پیدا و ناپیدا می‌شود.","Wide plains and shimmering mirages: at every bound the ass appears and vanishes in a new shape."],
      ["در پایانِ دشت گور خود را می‌نماید: اکوان دیو است، دیوی که رستمِ خفته را با زمینِ زیرش بر آسمان برد و در دریا افکند.","At the plain's end the beast reveals itself: Akvan Div, who lifted the sleeping Rostam with the ground beneath him and hurled him into the sea."]],
  tale:["این‌جا گورِ جادو در راه است، و گور نه گور، که اکوان دیو بود. روزی که من خفته بودم، او زمین را با من از جا برکند و به دریا انداخت؛ اما شنا کردم و بازگشتم.","Here lies the tale of the enchanted ass, which was no ass but Akvan Div. One day he tore up the ground with me asleep on it and threw me into the sea; but I swam and came back."]},
 {th:0,n:["شیراز","Shiraz"],node:[52.53,29.6],lab:"b",lm:["shiraz","pasargad"],
  title:["کرمِ هفتواد","Haftvad's Worm"],
  blurb:["دژی که مردم کرمی را در آن می‌پرستند؛ اردشیرِ بابکان، بنیان‌گذارِ ساسانیان، می‌آید تا آن را بر چیند. (پیوند با خانِ سوم: اژدها؛ این‌جا هم هیولایی خزنده در راه است.)","A fortress where people worship a worm; Ardashir, son of Babak and founder of the Sasanians, comes to end it. (Linked to the third khan: the dragon; here too a crawling monster blocks the way.)"],
  st:[["اردشیرِ بابکان از کرمی که مردم می‌پرستند آگاه می‌شود و راهیِ دژ هفتواد می‌گردد.","Ardashir hears of the worm the people worship and sets out for Haftvad's fortress."],
      ["دخترِ هفتواد سیبی شکافته بود و کرمی در آن یافت؛ کرم بزرگ شد و دژ از پرستندگانش پر است.","Haftvad's daughter had split an apple and found a worm inside; it grew huge and the fortress teems with its worshippers."],
      ["درِ غار پیش است؛ کرم بزرگ‌تر از هر دیوی خوابیده و تنها راهِ نابودی‌اش سرب یا روی گداخته است.","The cave mouth lies ahead; the worm is huger than any div, and only molten metal can destroy it."]],
  tale:["اردشیرِ بابکان را می‌گویم، همان که ساسانیان را بنیاد نهاد. هفتواد کرمی را پرورده بود که مردم می‌پرستیدندش؛ اردشیر با ترفند، فلزِ گداخته در کامش ریخت و ایران را از آن رها کرد.","I speak of Ardashir son of Babak, who founded the Sasanians. Haftvad had raised a worm the people worshipped; by a trick Ardashir poured molten metal down its throat and freed the land."]},
 {th:4,n:["تهران و دماوند","Tehran & Damavand"],node:[51.39,35.69],lab:"r",lm:["golestan","tehran"],
  title:["ضحاکِ ماردوش","Zahhak the Serpent-Shouldered"],
  blurb:["هزار سال ستم؛ کاوه‌ی آهنگر پیشبندِ چرمین را درفش می‌کند و فریدون با گرزِ گاوسر می‌آید. (پیوند با خانِ چهارم: زنِ جادو؛ ضحاک را هم اهریمن با نیرنگ و فریب به راه برد.)","A thousand years of tyranny: Kaveh the blacksmith raises his leather apron as a banner and Fereydun comes with the ox-headed mace. (Linked to the fourth khan: the sorceress; Ahriman too led Zahhak astray with trickery.)"],
  st:[["ضحاک از بوسه‌ی اهریمن بر دوشش دو مار دارد و هر روز مغزِ دو جوان خوراکِ آن‌هاست. کاوه برمی‌خیزد.","By Ahriman's kiss Zahhak bears two snakes on his shoulders, fed daily with the brains of two youths. Kaveh rises up."],
      ["کاوه پیشبندِ آهنگری را بر نیزه می‌کند و مردم گردِ فریدون می‌آیند؛ راه به سوی کاخِ ماران است.","Kaveh hoists his smith's apron on a spear and the people rally to Fereydun; the road leads to the palace of snakes."],
      ["کوهِ دماوند در برابر است؛ ضحاک تا آخرین دم می‌جنگد، پیش از آن‌که در کوه به بند افتد.","Mount Damavand looms ahead; Zahhak fights to the last breath before being chained in the mountain."]],
  tale:["ضحاک را اهریمن آشپزی بدلی با بوسه‌ای بر دوش‌ها فریفت و دو مار رویید. کاوه آهنگر درفشی از پیشبند ساخت و فریدون او را در دماوند به بند کشید. این جادو و فریب هم‌تبارِ همان زنِ جادوی خانِ چهارم است.","Ahriman, disguised as a cook, tricked Zahhak with a kiss on the shoulders, from which two snakes grew. Kaveh made a banner of his apron and Fereydun chained him in Damavand. That sorcery is kin to the sorceress of the fourth khan."]},
 {th:1,n:["توس","Tus"],node:[59.2,36.5],lab:"b",lm:["ferdowsi","neyshabur"],
  title:["رجزِ اشکبوس","Ashkabous's Challenge"],
  blurb:["مرزِ خراسان؛ توران لشکر کشیده و پهلوانی تورانی پیشِ صف رجز می‌خواند. (پیوند با خانِ پنجم: اولاد، نگهبانِ نیزه‌دار؛ این‌جا هم نگهبانِ لشکر جنگجویی با نیزه و سپر است.)","The Khorasan border: Turan has marched and a Turanian champion taunts the Iranians in front of the lines. (Linked to the fifth khan: Olad the spear-wielding guardian; here too a warrior with spear and shield guards his army.)"],
  st:[["لشکرِ توران بر مرزِ ایران رسیده و دشتِ خراسان و توس غرقِ کارزار است.","The Turanian army has reached Iran's border and the plains of Khorasan and Tus are drowned in war."],
      ["اردوگاهِ ایران؛ از باروی توس فراز می‌روی تا به پیشِ لشکرِ تورانی رسی.","The Iranian camp; you climb the ramparts of Tus to reach the front of the Turanian host."],
      ["پهلوانِ تورانی، اشکبوسِ کشانی، پیشِ صف آمده و ایرانیان را به رزم می‌خواند؛ هیچ‌کس هنوز پاسخش را نداده.","The Turanian champion Ashkabous of Kashan has ridden out and challenges the Iranians; none has answered him yet."]],
  tale:["اشکبوس پهلوانِ توران بود؛ پیشِ صف آمد و ایرانیان را به رجز خواند. تا من، رستم، به میدان رسیدم و او را از اسب فرو انداختم، هیچ ایرانی پاسخش را نداده بود.","Ashkabous was a champion of Turan; he came out before the lines and taunted the Iranians. Until I, Rostam, reached the field and unhorsed him, no Iranian had answered."]},
 {th:7,n:["تخت سلیمان","Takht-e Soleyman"],node:[47.2,36.55],lab:"b",lm:["takht","maragheh"],
  title:["غارِ افراسیاب","Afrasiab's Cave"],
  blurb:["کنارِ دریاچه‌ی چیچست؛ افراسیاب، شاهِ توران، پس از شکست‌های پیاپی در غاری نهان شده است. (پیوند با خانِ ششم: ارژنگ، سالارِ دیوان؛ این‌جا هم سالارِ سپاهِ دشمن در دژ و غار پنهان است.)","By Lake Chichast; Afrasiab, king of Turan, hides in a cave after endless defeats. (Linked to the sixth khan: Arzhang, lord of demons; here too the enemy's commander hides in a fortress and a cave.)"],
  st:[["افراسیاب، شاهِ توران و دشمنِ دیرینه‌ی ایران، از شکست گریخته و در آذربایجان نهان شده است.","Afrasiab, king of Turan and Iran's ancient foe, has fled his defeats and hides in Azerbaijan."],
      ["کنارِ دریاچه‌ی چیچست؛ شب است و بازمانده‌ی تورانیان در تاریکی پراکنده‌اند.","By Lake Chichast, it is night and the remnants of the Turanians are scattered in the dark."],
      ["غارِ افراسیاب تاریک و نمناک است و باید او را از آن بیرون آورد.","Afrasiab's cave is dark and damp, and he must be drawn out of it."]],
  tale:["افراسیاب، شاهِ توران، دشمنِ کهنِ ایران بود. پس از شکست‌ها در غاری کنارِ دریاچه‌ی چیچست نهان شد؛ تا کی‌خسرو و هوم او را یافتند و آن دشمنِ دیرین به سزای کارهایش رسید.","Afrasiab, king of Turan, was Iran's ancient enemy. After his defeats he hid in a cave by Lake Chichast, until Kay Khosrow and Hum found him and the old foe met the end his deeds deserved."]},
 {th:2,n:["زابل","Zabol"],node:[61.5,31.03],lab:"b",lm:["khajeh","khajeh"],
  title:["رستم و اسفندیار","Rostam and Esfandiyar"],
  blurb:["زابلستان؛ گشتاسب اسفندیار را می‌فرستد تا رستم را در بند ببرد. (پیوند با خانِ هفتم: دیوِ سپید، سخت‌ترین آزمون؛ اسفندیارِ روئین‌تن نیز سخت‌ترین رقیبِ رستم است.)","Zabulistan: Goshtasp sends Esfandiyar to bring Rostam in chains. (Linked to the seventh khan: the White Div, the hardest trial; invulnerable Esfandiyar is Rostam's hardest foe.)"],
  st:[["گشتاسب، شاهِ ایران، اسفندیار را به زابلستان می‌فرستد تا رستم را در بند به دربار برد؛ رستم این ننگ را نمی‌پذیرد.","Shah Goshtasp sends Esfandiyar to Zabulistan to bring Rostam to court in chains; Rostam will not accept the shame."],
      ["دشتِ زابلستان و بادهای سخت؛ سیمرغ از دور نظاره‌گر است و راهِ شکستنِ اسفندیار را می‌داند.","The plain of Zabulistan under hard winds; the Simurgh watches from afar and knows how to break Esfandiyar."],
      ["اسفندیارِ روئین‌تن در برابر است؛ تنها تیرِ گز بر چشمانش می‌تواند او را از پا بیندازد.","Invulnerable Esfandiyar stands before you; only a tamarisk arrow to his eyes can bring him down."]],
  tale:["این غمگین‌ترین نبرد من بود: اسفندیارِ روئین‌تن آمد تا مرا در بند به دربار برد. سیمرغ راهِ شکستنش را نشانم داد: تیرِ گز بر چشم. رزمی بود که پیروزی‌اش هم شادی نداشت.","This was my saddest duel: invulnerable Esfandiyar came to bring me in chains. The Simurgh showed me how to break him: a tamarisk arrow to the eyes. A fight whose victory brought no joy."]}
];
/* باس‌ها در KHAN و BC با شاخصِ ۷ تا ۱۳ ثبت می‌شوند تا همه‌ی سازوکارِ گفت‌وگو، موسیقی، نوار جان و غیره برایشان کار کند */
[
 {n:["غول‌گرازِ ارمان","The Great Boar of Irman"],
  story:["غول‌گرازِ ارمان؛ بزرگ‌ترین گرازِ بیشه","The great boar of the Irman forest"],
  lines:[["k","هیچ پهلوانی تا امروز از بیشه‌ی من زنده بیرون نرفته؛ دندانم کوه را می‌شکافد.","No hero has ever left my thicket alive; my tusks split mountains."],
   ["h","به فرمانِ کی‌خسرو آمده‌ام تا ارمان از ستمِ تو رها شود.","I have come on Kay Khosrow's command so that Irman is freed from your tyranny."],
   ["k","پس پیش بیا تا زیرِ سُمّم خاک شوی!","Then come, and be dust beneath my hooves!"],
   ["h","هرچه بتازی، دلیری از تو سنگین‌تر است.","However hard you charge, courage weighs more than you."]],
  win:["غول‌گراز بر خاک افتاد و ارمان از بیمِ گرازان آسوده شد. نخستین داستانِ فرعی به پایان رسید.","The great boar fell and Irman was freed from the fear of boars. The first side tale is complete."],
  last:["آه، دندانم شکست... بیشه‌ی ارمان از آنِ توست؛ بیژن را در راه از رشکِ هم‌راهش بپای.","Alas, my tusk is broken... the forest of Irman is yours; guard Bizhan from his companion's jealousy."]},
 {n:["اکوان دیو","Akvan Div"],
  story:["اکوان دیو؛ دیوِ گورنما","Akvan Div, the ass-shaped demon"],
  lines:[["k","گورِ دشت بودم و گله‌ها را دریدم؛ اکنون که مرا یافتی، دریا گورِ تو خواهد بود.","I was the wild ass of the plain and tore your herds; now that you found me, the sea shall be your grave."],
   ["h","هر شکلی که بگیری، زمین و آسمان و دریا هیچ‌کدام تو را از من نمی‌رهانند.","Whatever shape you take, land, sky and sea will not save you from me."],
   ["k","رستم را با زمینش بر آسمان بردم و به دریا افکندم؛ تو نیز چنین خواهی شد!","I lifted Rostam with his very ground and threw him in the sea; so will it be with you!"],
   ["h","و رستم از دریا بازگشت. من نیز بازمی‌گردم.","And Rostam came back from the sea. So shall I."]],
  win:["اکوان دیو فروافتاد و گورِ جادویی ناپدید شد. دومین داستانِ فرعی به پایان رسید.","Akvan Div fell and the enchanted ass vanished. The second side tale is complete."],
  last:["دیگر شکل عوض نمی‌کنم... دریا از من رها شد؛ برو و داستانت را ادامه بده.","I change shape no more... the sea is rid of me; go and continue your tale."]},
 {n:["کرمِ هفتواد","Haftvad's Worm"],
  story:["کرمِ هفتواد؛ کرمی که مردم می‌پرستیدند","Haftvad's worm, which the people worshipped"],
  lines:[["k","مردم مرا می‌پرستند و دژم را ستون‌هایی چون خودم نگه می‌دارند؛ تو که‌ای؟","The people worship me and my fortress stands on pillars like myself; who are you?"],
   ["h","آمده‌ام تا ایران را از پرستشِ تو رها کنم.","I have come to free Iran from your worship."],
   ["k","هیچ تیغی بر پوستِ من کارگر نیست! هیچ آتشی مرا نمی‌سوزاند!","No blade bites my hide! No fire burns me!"],
   ["h","پس به فلزِ گداخته و دلیری می‌زنمت.","Then I shall strike you with molten metal and courage."]],
  win:["کرمِ هفتواد نابود شد و مردم از پرستشش رها شدند. سومین داستانِ فرعی به پایان رسید.","Haftvad's worm was destroyed and the people were freed from worshipping it. The third side tale is complete."],
  last:["مرا چون خدا می‌پرستیدند و اینک خاکم... بروید و دیگر به هیچ کرمی سجده نکنید.","They worshipped me as a god and now I am dust... go, and bow to no worm again."]},
 {n:["ضحاکِ ماردوش","Zahhak the Serpent-Shouldered"],
  story:["ضحاکِ ماردوش؛ شاهِ ستمگرِ هزار ساله","Zahhak the serpent-shouldered, the thousand-year tyrant"],
  lines:[["k","هزار سال بر جهان فرمان راندم؛ مارانِ دوشم هر روز خوراکِ تازه می‌خواهند!","A thousand years I ruled the world; the snakes on my shoulders want fresh food every day!"],
   ["h","به نامِ کاوه‌ی آهنگر و مردمی که خاموش مانده‌اند، فرمانروایی‌ات بس است.","In the name of Kaveh the smith and the silenced people, your reign is over."],
   ["k","مرا اهریمن آفرید، نه شما! بجنگ تا مارانم را سیر کنی!","Ahriman made me, not you! Fight, and feed my serpents!"],
   ["h","مارانت را می‌بُرم و تو را به دماوند می‌فرستم.","I will cut your serpents and send you to Damavand."]],
  win:["ضحاک در هم شکست و به کوه دماوند در بند شد. چهارمین داستانِ فرعی به پایان رسید.","Zahhak was broken and chained in Mount Damavand. The fourth side tale is complete."],
  last:["مارانم خاموش شدند... هزار سال بس بود؛ ایران آزاد است.","My serpents fall silent... a thousand years were enough; Iran is free."]},
 {n:["اشکبوسِ کشانی","Ashkabous of Kashan"],
  story:["اشکبوسِ کشانی؛ پهلوانِ تورانی","Ashkabous of Kashan, Turanian champion"],
  lines:[["k","من اشکبوسم؛ سپاهِ ایران از ترسِ من لرزان است. کدام پهلوانتان پیش آید؟","I am Ashkabous; the Iranian host trembles in fear of me. Which of your champions will step forward?"],
   ["h","من پیش می‌آیم؛ نه رجزِ تو بلکه بازویم سخن خواهد گفت.","I step forward; not your boasting but my arm shall speak."],
   ["k","نیزه‌ام تا اکنون هر حریفی را از اسب انداخته؛ سپرت را آماده کن!","My spear has unhorsed every rival; ready your shield!"],
   ["h","نیزه و سپرت از رجزت سبک‌ترند.","Your spear and shield are lighter than your boasting."]],
  win:["اشکبوس از اسب فرو افتاد و توران رجزخوانی را فراموش کرد. پنجمین داستانِ فرعی به پایان رسید.","Ashkabous fell from his horse and Turan forgot its boasting. The fifth side tale is complete."],
  last:["رجز خواندم و افتادم... پهلوانی به بازوست، نه به زبان.","I boasted and I fell... heroism is in the arm, not the tongue."]},
 {n:["افراسیاب","Afrasiab"],
  story:["افراسیاب؛ شاهِ توران","Afrasiab, king of Turan"],
  lines:[["k","من افراسیابم، شاهِ توران! چندین بار از پیش‌تان گریختم، هیچ‌گاه نابود نشدم.","I am Afrasiab, king of Turan! Many times I fled you and was never destroyed."],
   ["h","این‌بار گریزگاهی نداری؛ غار تو پایانِ راه است.","There is no escape this time; your cave is the end of the road."],
   ["k","جادو و سپاهِ شب با من است؛ تاریکی از آنِ من است!","Sorcery and the army of the night are with me; the dark is mine!"],
   ["h","روشنی بر تاریکی چیره می‌شود؛ ایران خواهد ماند.","Light prevails over dark; Iran will endure."]],
  win:["افراسیاب از غار بیرون کشیده شد و دشمنِ دیرینِ ایران به سزای کارش رسید. ششمین داستانِ فرعی به پایان رسید.","Afrasiab was drawn out of the cave and Iran's ancient foe met the end he deserved. The sixth side tale is complete."],
  last:["جهان از من آسوده شد... اما بدان، هر که ستم کند سرانجامش همین است.","The world is rid of me... but know this: every oppressor ends so."]},
 {n:["اسفندیارِ روئین‌تن","Esfandiyar the Invulnerable"],
  story:["اسفندیارِ روئین‌تن؛ سخت‌ترین رزم","Esfandiyar the invulnerable, the hardest duel"],
  lines:[["k","من اسفندیارم، روئین‌تنِ ایران؛ شاه فرمان داده تو را در بند به دربار برم.","I am Esfandiyar, Iran's invulnerable; the Shah commands me to take you to court in chains."],
   ["h","هیچ پهلوانی نمی‌تواند کسی را در بند ببرد که آزاده زیسته؛ پس بجنگ.","No hero can chain one who lived free; then fight."],
   ["k","هیچ تیر و تیغی بر تنِ من کارگر نیست؛ جز دو چشمم هیچ‌جا آسیب‌پذیر نیستم!","No arrow or blade bites my body; save my two eyes I have no weakness!"],
   ["h","و سیمرغ همین را به من گفته: تیرِ گز، و دلی استوار.","And the Simurgh told me the same: a tamarisk arrow and a steady heart."]],
  win:["اسفندیارِ روئین‌تن بر خاک افتاد؛ رزمی که پیروزی‌اش هم اندوه داشت. داستان‌های شاهنامه را پشتِ سر گذاشتی!","Invulnerable Esfandiyar fell; a duel whose victory carried sorrow too. You have passed the tales of the Shahnameh!"],
